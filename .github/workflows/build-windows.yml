name: Build Windows

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Installer version
        required: false
        default: 0.1.0

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nodejs

      - name: Run Windows regression tests
        run: mingw32-make test-all

      - name: Build frontend + Windows release
        run: mingw32-make release-windows

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ inputs.app_version }}"
          if (-not $version) { $version = "0.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\netscan.iss"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netscan-windows
          path: |
            packaging/windows/Output/NetScan-Setup-*.exe
          if-no-files-found: error
